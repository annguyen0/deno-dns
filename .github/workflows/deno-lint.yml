# CI/CD cho deno-dns (plan §6.1).
# Luu y so voi ban phan trong plan:
# - job "lint-format-check" hop lech hop check, lint, fmt, test
# - trigger: push, pull_request, workflow_dispatch

name: deno-dns · Lint & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  DENO_VERSION: "2.9.7"

jobs:
  lint-format-check:
    name: Lint · Format · Type-Check · Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Cache Deno artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}

      - name: Type-check
        run: deno task check

      - name: Lint
        run: deno task lint

      - name: Format check
        run: deno fmt --check

      - name: Run test suite
        run: deno test

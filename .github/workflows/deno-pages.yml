# CI/CD cho deno-dns (plan §6.3 - GitHub Pages deployment).

name: deno-dns · Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

env:
  DENO_VERSION: "2.9.7"

jobs:
  docs:
    name: Publish Architecture Docs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Stage docs site
        run: |
          mkdir -p _site/docs
          cp docs/*.md _site/docs/
          cp CHANGELOG.md _site/
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>deno-dns — documentation</title>
            <style>
              body{font-family:system-ui,sans-serif;max-width:46rem;margin:2rem auto;padding:0 1rem;line-height:1.6}
              h1{border-bottom:1px solid #e2e2e2;padding-bottom:.4rem}
              a{color:#0969da;text-decoration:none} a:hover{text-decoration:underline}
            </style>
          </head>
          <body>
            <h1>deno-dns — documentation</h1>
            <p>DoH server (RFC 8484) on Deno + Deno KV. Doc-as-code: docs are published
               as raw Markdown under <code>/docs/</code>.</p>
            <ul>
              <li><a href="docs/ARCHITECTURE.md">Architecture</a></li>
              <li><a href="docs/SOFTWARE_DESIGN.md">Software design</a></li>
              <li><a href="docs/CONTRIBUTING.md">Contributing</a></li>
              <li><a href="CHANGELOG.md">Changelog</a></li>
            </ul>
          </body>
          </html>
          EOF
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# CI/CD cho deno-dns (plan §6.4 - PR preview).

name: deno-dns CI/CD

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

env:
  DENO_VERSION: "2.9.7"

jobs:
  preview:
    # Deploy preview cho PR (plan §6.2 "Deploy preview for PR branch"):
    # 1) Cho + commit status `deploy/<owner>/<repo>` cua Deno Deploy → link build/Preview.
    # 2) Upload artifact docs tu branch cua PR (Pages cung publish Markdown, khong can render).
    # 3) Sticky comment tren PR: trang thai build + file docs thay doi + artifact.
    # Preview URL truc tiep (https://<domain>.deno.dev) can secret DENO_DEPLOY_TOKEN;
    # khong co token thi comment chi hien trang thai build + link console (khong fail job).
    # PR tu fork: khong co secret/Deno Deploy build -> bo qua phan deploy, van comment docs.
    name: Preview (Deno Deploy + docs)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: github.event_name == 'pull_request'
    concurrency:
      group: preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # can lich su day du de tinh merge-base voi base branch
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Detect changed docs vs base branch
        id: docs
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git diff --name-only "origin/${BASE_REF}...HEAD" -- docs/ README.md CHANGELOG.md > changed_docs.txt
          if [ -s changed_docs.txt ]; then
            echo "has_docs=true" >> "$GITHUB_OUTPUT"
            echo "files=$(tr '\n' ',' < changed_docs.txt | sed 's/,$//')" >> "$GITHUB_OUTPUT"
          else
            echo "has_docs=false" >> "$GITHUB_OUTPUT"
            echo "files=" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for Deno Deploy build status
        id: deploy
        # Chi repo gong moi co Deno Deploy build status (fork khong co app/secret).
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          state=""
          description=""
          target=""
          # Deno Deploy build thuong xong trong ~1 phut; cho toi da 20 x 15s = 5 phut.
          for attempt in $(seq 1 20); do
            payload=$(curl -sS -m 20 -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$SHA/status" || echo '{}')
            line=$(printf '%s' "$payload" \
              | jq -r '.statuses[]? | select(.context | startswith("deploy/")) | "\(.state)\t\(.description)\t\(.target_url)"' 2>/dev/null \
              | head -n1 || true)
            if [ -n "$line" ]; then
              state=$(printf '%s' "$line" | cut -f1)
              description=$(printf '%s' "$line" | cut -f2)
              target=$(printf '%s' "$line" | cut -f3)
            fi
            if [ -n "$state" ] && [ "$state" != "pending" ]; then
              break
            fi
            sleep 15
          done
          {
            echo "state=$state"
            echo "description=$description"
            echo "target_url=$target"
          } >> "$GITHUB_OUTPUT"
          echo "Deno Deploy status: ${state:-<khong co>} - ${description:-<khong co>} ${target}"

      - name: Resolve public preview URL (tuy chon — can DENO_DEPLOY_TOKEN)
        id: preview
        # Khong co secret thi bo qua (khong fail): comment chi hien trang thai build.
        if: github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
          DENO_DEPLOY_PROJECT: ${{ vars.DENO_DEPLOY_PROJECT || 'deno-dns' }}
        run: |
          set -u
          url=""
          if [ -z "${DENO_DEPLOY_TOKEN:-}" ]; then
            echo "::notice::Chua co secret DENO_DEPLOY_TOKEN - bo qua buoc lay preview URL truc tiep."
            echo "url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          subject=$(git log -1 --format=%s HEAD)
          payload=$(curl -sS -m 30 -H "Authorization: Bearer $DENO_DEPLOY_TOKEN" \
            "https://api.deno.com/v1/projects/$DENO_DEPLOY_PROJECT/deployments?limit=50" || echo '[]')
          # Uu tien deployment khop commit message; neu khong thi deployment moi thanh cong.
          url=$(printf '%s' "$payload" | jq -r --arg s "$subject"
            '([.[]? | select(.status == "success")
              | select(((.domains // []) | length) > 0)]) as $ok
            | ($ok | sort_by(.createdAt) | reverse) as $newest
            | (($newest | map(select(.description == $s)) | .[0]) // $newest[0] // {})
            | .domains[0] // empty' 2>/dev/null || true)
          case "$url" in
            http*) ;;
            "") ;;
            *) url="https://$url" ;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: ${url:-<khong tim thay>}"

      - name: Stage preview site
        if: steps.docs.outputs.has_docs == 'true'
        run: |
          mkdir -p _site
          cp docs/*.md README.md CHANGELOG.md _site/

      - name: Upload preview artifact
        if: steps.docs.outputs.has_docs == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview-pr-${{ github.event.number }}
          path: _site
          retention-days: 14

      - name: Post / update sticky PR comment
        # continue-on-error: PR tu fork co token read-only (khong comment duoc) — van giu job xanh
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          DOCS_FILES: ${{ steps.docs.outputs.files }}
          PR_NUMBER: ${{ github.event.number }}
          DEPLOY_STATE: ${{ steps.deploy.outputs.state }}
          DEPLOY_DESC: ${{ steps.deploy.outputs.description }}
          DEPLOY_TARGET: ${{ steps.deploy.outputs.target_url }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        with:
          script: |
            const marker = "<!-- deno-dns-preview -->";
            const files = (process.env.DOCS_FILES || "")
              .split(",")
              .filter((f) => f.trim().length > 0);
            const runUrl =
              `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`
              `/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const state = process.env.DEPLOY_STATE || "";
            const desc = process.env.DEPLOY_DESC || "";
            const buildUrl = process.env.DEPLOY_TARGET || "";
            const previewUrl = process.env.PREVIEW_URL || "";

            const icons = {
              success: "✅",
              failure: "❌",
              error: "❌",
              pending: "⏳",
            };
            const deploy = [];
            if (process.env.IS_FORK === "true") {
              deploy.push(
                "_PR tu fork: khong co Deno Deploy preview (fork khong nhan secret)._",
              );
            } else if (!state) {
              deploy.push("_Chua thay Deno Deploy build status cho commit nay._");
            } else {
              deploy.push(
                `**Deno Deploy**: ${icons[state] || state}${desc ? ` ${desc}` : ""}`,
              );
              if (buildUrl) deploy.push(`- 🔧 [Chi tiet build](${buildUrl})`);
              if (previewUrl) {
                deploy.push(`- 🌐 **Preview**: [${previewUrl}](${previewUrl})`);
              } else {
                deploy.push(
                  "- 🌐 Preview URL tiep: them secret `DENO_DEPLOY_TOKEN` " +
                    "(xem `docs/CONTRIBUTING.md`) de comment kem link deploy.",
                );
              }
            }

            const docs = files.length > 0
              ? [
                  "### 📄 Docs preview",
                  "",
                  "Tai lieu se duoc deploy len GitHub Pages khi merge vao `main`. ",
                  "File thay doi:",
                  ...files.map((f) => `- \`${f}\``),
                  "",
                  `📦 Tai ban preview: [workflow run](${runUrl}) -> artifact ` +
                  `**\`docs-preview-pr-${process.env.PR_NUMBER}\`** ` +
                  "(tai xuat, giai ngan de xem).",
                ]
              : [
                  "_Khong co thay doi trong `docs/`, `README.md` hoac `CHANGELOG.md`._",
                ];

            const body = [
              marker,
              `### 🚀 Preview — \`${sha}\``,
              "",
              ...deploy,
              "",
              ...docs,
              "",
              "_Comment này tự cập nhật moi lan push commit moi vao PR._",
            ].join("\n");

            const { owner, repo } = context.repo;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) =>
              c.body && c.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: context.issue.number,
                body,
              });
            }
